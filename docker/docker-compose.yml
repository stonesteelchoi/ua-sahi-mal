# UA-SAHI-MAL 재현 환경.
#
#   docker compose -f docker/docker-compose.yml build
#   docker compose -f docker/docker-compose.yml run --rm verify    # 검증
#   docker compose -f docker/docker-compose.yml run --rm offline   # 네트워크 차단 상태로 검증
#   docker compose -f docker/docker-compose.yml run --rm shell     # 대화형 셸
#
# 사내 프록시가 registry/pytorch 를 막으면 .env 에 아래를 넣는다.
#   BASE_IMAGE=registry.corp/library/python:3.12-slim
#   TORCH_INDEX_URL=pypi
#   APT_MIRROR=http://mirror.corp/debian

services:
  base: &base
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-python:3.12-slim}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        TORCH_VERSION: ${TORCH_VERSION:-2.8.0}
        TORCHVISION_VERSION: ${TORCHVISION_VERSION:-0.23.0}
        APT_MIRROR: ${APT_MIRROR:-}
    image: ua-sahi-mal:cpu
    working_dir: /workspace
    environment:
      YOLO_CONFIG_DIR: /tmp/ultralytics
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "${OMP_NUM_THREADS:-1}"
      MKL_NUM_THREADS: "${MKL_NUM_THREADS:-1}"
      PYTHONHASHSEED: "0"
    volumes:
      - ../datasets:/workspace/datasets:ro
      - ../runs:/workspace/runs
      - ../output:/workspace/output

  verify:
    <<: *base
    command: ["bash", "/workspace/scripts/verify_env.sh"]

  # 저장소는 오프라인 fail-closed 로 설계되어 있다. 실측 실행은 이 프로파일로.
  offline:
    <<: *base
    network_mode: none
    command: ["bash", "/workspace/scripts/verify_env.sh"]

  shell:
    <<: *base
    command: ["bash"]
    stdin_open: true
    tty: true
