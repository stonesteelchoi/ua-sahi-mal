schema_version: 1
experiment_id: malevis-decode-transfer-v1

model:
  architecture: decode-compact-dropout-cnn-v1
  image_size: 224
  embedding_dim: 128
  dropout: 0.30

training:
  internal_validation_per_class: 50
  epochs: 12
  batch_size: 32
  learning_rate: 0.002
  weight_decay: 0.0001
  center_loss_weight: 0.01
  label_smoothing: 0.05
  patience: 4
  num_workers: 0
  torch_threads: 8

evaluation:
  mc_dropout_passes: 5
  bootstrap_replicates: 500
  ece_bins: 15
  timing_warmup_batches: 3
  timing_repeats: 3
