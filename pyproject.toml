[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ua-sahi-mal"
version = "0.2.0"
description = "Safe malware-to-image localization research scaffold with budgeted UA-SAHI inference"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "UA-SAHI-MAL contributors" }]
dependencies = [
  "click>=8.1,<9",
  "numpy>=2.0,<2.3",
  "opencv-python>=4.12.0.88,<5",
  "pillow>=10,<13",
  "PyYAML>=6,<7",
  "sahi==0.12.2",
  "shapely>=2,<3",
  "tqdm>=4.66,<5",
  "ultralytics==8.4.67",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pefile>=2024.8.26,<2025",
  "py7zr>=1.0,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.11,<1",
]

[project.scripts]
ua-sahi-mal = "ua_sahi_mal.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider --basetemp=.pytest_tmp"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["external"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP006", "UP007", "UP035"]
