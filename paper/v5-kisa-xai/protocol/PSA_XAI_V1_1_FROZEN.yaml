  result_era_matched: 0.9028-0.9112
  gate_tripped: true
  strongest_single_features:
    max_section_entropy: 0.822
    linker_major: 0.778
    file_entropy: 0.759
    subsystem: 0.763
  ablation_finding: redundant_no_single_family_removal_drops_below_0.90
  latent_confounder: toolchain_era_gap   # benign VS2005-2013, malicious VC6/Delphi
