# Section 5 of the experiment protocol tripped (metadata-only AUROC >= 0.90) and the
# rule was kept unchanged by decision on 2026-09-15. Section 14 therefore limits the
# main conclusion to dataset-bias evaluation. The claims list encodes that.
claims:
  permitted:
    - model_attributed_region
    - explanation_faithfulness
    - pe_structure_alignment
    - dataset_specific_static_discrimination
    - dataset_bias_evaluation
  prohibited_without_new_evidence:
    - malicious_decision_evidence          # downgraded: metadata shortcut gate tripped
    - malicious_semantics
    - true_malicious_code_region
    - malicious_behavior_ground_truth
    - analyst_time_reduction
    - proven_temporal_robustness
    - cross_year_generalization            # single 2018 collection, no external set yet
    - novel_gradcam_algorithm
  mandatory_reported_baseline:
    metadata_only_logistic_auroc_group_disjoint: 0.95   # 0.9499-0.9526 across two implementations

