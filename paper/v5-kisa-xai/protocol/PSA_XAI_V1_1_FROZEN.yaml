  section_14_consequence: main_conclusion_limited_to_dataset_bias_evaluation
  testable_prediction: gradcam_mass_should_concentrate_in_high_entropy_executable_sections_not_header

model:
  primary: resnet18
  reference_required: false
  initialization: imagenet  # selected on validation by 2026-09-20; retained for 2026-09-24 C8 retraining
  optimizer: adamw
  epochs_max: 30
  early_stopping_patience: 5
  seeds: [42, 43, 44]
  amp: true
  batch_size: 512   # pilot 6070.7 MiB; max training 6072.7 / 8123.4 MiB (74.76%)
  selection_metric: validation_macro_f1
  required_comparison:
    metadata_only_auroc_group_disjoint: 0.95
    retrain_validation_auroc: {seed42: 0.9868352431439574, seed43: 0.9873733952823303, seed44: 0.9871156021426235}
    interpretation: all_three_above_0_95_descriptive_only_different_evaluation_splits
  baselines: [majority, metadata_logistic, byte_histogram_logistic]

classification_sanity:
  macro_f1_margin_over_majority: 0.10
  balanced_accuracy_min: 0.70
  per_class_recall_min: 0.60
  require_seed_direction_agreement: true

xai:
  method: Grad-CAM
  target_layer: layer4.1   # BasicBlock; CUDA activation/gradient [1,512,7,7] verified 2026-09-21
  library_vs_hook_agreement_spearman: 0.9999999999   # RTX 5070 CUDA smoke 2026-09-15
  primary_target: malicious_logit_on_all_malicious_test_files
  secondary_targets: [predicted_class, benign_logit, correctly_detected_malicious_subset]
  upsampling: {method: bilinear, align_corners: false}
  budgets: [0.05, 0.10, 0.20, 0.40]
  primary_budget: 0.10
  interval_overshoot_policy: record_requested_and_achieved_then_match_controls_to_achieved_bytes
  empty_positive_cam_policy: retain_and_flag
  controls: [uniform_random_20_repeats, front_position, entropy, structure_matched_random_20_repeats]
  primary_comparator: structure_matched_random
  fills: {primary: structure_conditioned_resampling, robustness: local_median, local_median_window: [5, 5], diagnostic: zero}
  paired_comparison:
    sample: same_sample_for_gradcam_and_control
    budget: same_achieved_unique_source_byte_budget
    fill_random_state: shared_for_gradcam_and_control_per_sample_budget_fill_control_repeat

primary_hypotheses:
  h1: gradcam_top10_deletion_delta_nll_gt_structure_matched_random
  h2: gradcam_top10_keep_only_malicious_score_gt_structure_matched_random
  familywise_tests: 2
  correction: holm

statistics:
  unit: imphash_group  # aggregate paired file differences within each group, then resample groups
  sensitivity_analysis: file  # paired file-level bootstrap, reported separately
  paired_bootstrap_repeats: 2000
  confidence_level: 0.95
  random_control_repeats_per_file: 20
  report_each_seed: true
  report_seed_average: true
  primary_hypothesis_report_fields: [effect, ci_95_lower, ci_95_upper, holm_adjusted_p, eligible_n]
  effect_definition: paired_mean_difference_gradcam_minus_structure_matched_random
  primary_population: all_malicious_test_files
  secondary_population: correctly_detected_malicious_files
  internal_test_malicious_n: 17407  # C8r-c: pre-dedup 17431 minus 24 raster duplicates; benign 12740 minus 1 = 12739

